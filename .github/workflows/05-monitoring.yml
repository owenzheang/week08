name: 05 - Deploy Monitoring

on:
  push:
    branches:
      - task102-devsecops
    paths:
      - "monitoring/**"
      - ".github/workflows/05-monitoring.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Tested commit to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: monitoring-week08
  cancel-in-progress: false

jobs:
  deploy-monitoring:
    name: Deploy Prometheus and Grafana
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group koalatech-week08-rg \
            --name owenzhengweek8cluster \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Add monitoring chart repository
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Install Prometheus and Grafana
        run: |
          helm upgrade --install monitoring \
            prometheus-community/kube-prometheus-stack \
            --version 91.5.2 \
            --namespace monitoring \
            --create-namespace \
            --values monitoring/values.yaml \
            --wait \
            --timeout 15m

      - name: Verify monitoring deployments
        run: |
          kubectl rollout status deployment/monitoring-grafana \
            -n monitoring --timeout=300s
          kubectl rollout status statefulset/prometheus-monitoring-kube-prometheus-prometheus \
            -n monitoring --timeout=300s
          kubectl get pods -n monitoring
          kubectl get services -n monitoring

      - name: Show diagnostics if deployment fails
        if: failure()
        run: |
          kubectl get pods -n monitoring -o wide
          kubectl get events -n monitoring --sort-by=.metadata.creationTimestamp